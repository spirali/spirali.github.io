{% extends "base.html" %}

{% block content %}
<div class="post">
    {%- if page.extra.my_draft -%}
    <p class="draft-notice">⚠ This text is <strong>draft</strong>.</p>
    {%- endif -%}
    <h1 class="title">
        {{ page.title | safe }}
    </h1>
    <p class="subtitle">{{ page.date | date(format="%B %-d, %Y") }}</p>
    {{ page.content | safe }}
</div>
{% endblock content %}
